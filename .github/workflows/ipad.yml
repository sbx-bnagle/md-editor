# Builds the iPad app on a Mac: compiles the Swift shell, runs the app's self test in the iOS
# Simulator, and makes an unsigned .ipa (for Sideloadly, which signs it with your Apple Account).
# Results are reported as annotations on the run, and each build from main is published as the
# pre-release "ipad-latest" (the .ipa, the app package, and the self test's result and screenshot).
name: iPad app

on:
  push:
    branches: [main]
    paths:
      - 'apps/ipad/**'
      - 'packages/**'
      - 'resources/seed/**'
      - 'resources/icon/**'
      - '.github/workflows/ipad.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.bradnagle.foliodome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build the web folder
        run: npm run build:ipad

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          cd apps/ipad/xcode && xcodegen generate

      - name: Compile for the Simulator
        run: |
          status=0
          xcodebuild -project apps/ipad/xcode/FolioDome.xcodeproj -scheme FolioDome -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build > build-sim.log 2>&1 || status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build-sim.log | sort -u | head -100 || true
          exit $status
      - name: Report compile errors
        if: failure()
        run: grep -E "error:" build-sim.log | sort -u | head -10 | while IFS= read -r line; do echo "::error title=Swift::${line}"; done

      - name: Self test in the iOS Simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit()]
          runtimes = sorted([r for r in devices if "iOS" in r and any("iPad" in d["name"] for d in devices[r])], key=version)
          ipads = [d for d in devices[runtimes[-1]] if "iPad" in d["name"]]
          pro = [d for d in ipads if "Pro" in d["name"]]
          print((pro or ipads)[0]["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "build/sim/Build/Products/Debug-iphonesimulator/Folio Dome.app"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -FolioSelfTest YES
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          RESULT="$DATA/Documents/selftest.json"
          for i in $(seq 1 150); do
            if [ -f "$RESULT" ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('$RESULT')).get('done') else 1)" 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 3
          xcrun simctl io "$UDID" screenshot selftest.png || true
          cp "$RESULT" selftest.json 2>/dev/null || echo '{"ok": false, "done": false, "steps": [{"name": "self test", "ok": false, "ms": 0, "detail": "no result file"}]}' > selftest.json
          cp "$DATA/Documents/Self Test Output/Test.pdf" selftest.pdf 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'eventMessage CONTAINS "Folio Dome"' --style compact > simulator.log 2>&1 || true
          python3 - <<'PY'
          import json
          r = json.load(open("selftest.json"))
          lines = [f"{'ok' if s['ok'] else 'FAILED'} {s['name']} ({s['ms']} ms){': ' + s['detail'][:150] if s.get('detail') else ''}" for s in r["steps"]]
          print("\n".join(lines))
          summary = " | ".join(lines).replace("\n", " ")
          print(f"::notice title=Self test ({'passed' if r['ok'] and r.get('done') else 'failed'})::{summary[:3800]}")
          for s in [s for s in r["steps"] if not s["ok"]][:9]:
              print(f"::error title=Self test: {s['name']}::{(s.get('detail') or '')[:500]}")
          if not (r["ok"] and r.get("done")):
              raise SystemExit(1)
          PY

      - name: Unsigned IPA
        if: always()
        run: |
          VERSION=$(node -p "require('./apps/ipad/package.json').version")
          status=0
          xcodebuild -project apps/ipad/xcode/FolioDome.xcodeproj -scheme FolioDome -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build-device.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-device.log | sort -u | head -40 || true
          if [ $status -ne 0 ]; then grep -E "error:" build-device.log | sort -u | head -5 | while IFS= read -r line; do echo "::error title=Device build::${line}"; done; exit $status; fi
          mkdir -p ipa/Payload
          cp -R "build/device/Build/Products/Release-iphoneos/Folio Dome.app" ipa/Payload/
          (cd ipa && zip -qry "../Folio-Dome-$VERSION.ipa" Payload)
          ls -la "Folio-Dome-$VERSION.ipa"
          shasum -a 256 "Folio-Dome-$VERSION.ipa" | tee ipa.sha256
          echo "::notice title=IPA::Folio-Dome-$VERSION.ipa $(stat -f%z "Folio-Dome-$VERSION.ipa") bytes, sha256 $(cut -d' ' -f1 ipa.sha256)"

      - name: App package for Swift Playgrounds and Xcode
        if: always()
        run: |
          VERSION=$(node -p "require('./apps/ipad/package.json').version")
          cd apps/ipad && zip -qry "../../Folio-Dome-$VERSION-swiftpm.zip" "Folio Dome.swiftpm"

      - name: Does the app package build as it is (as Swift Playgrounds and Xcode open it)?
        if: always()
        continue-on-error: true
        run: |
          cd "apps/ipad/Folio Dome.swiftpm"
          xcodebuild -list 2>&1 | tail -20
          xcodebuild -scheme "Folio Dome" -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../../build/pkg CODE_SIGNING_ALLOWED=NO build > ../../../build-pkg.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" ../../../build-pkg.log | sort -u | head -40 || true
          if grep -q "BUILD SUCCEEDED" ../../../build-pkg.log; then echo "::notice title=App package::builds with xcodebuild"; else grep -E "error:" ../../../build-pkg.log | sort -u | head -5 | while IFS= read -r line; do echo "::warning title=App package::${line}"; done; fi

      - name: Publish as the pre-release ipad-latest
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/ipad/package.json').version")
          PASSED=$(python3 -c "import json; r=json.load(open('selftest.json')); print('passed' if r.get('ok') and r.get('done') else 'FAILED')" 2>/dev/null || echo "not run")
          FILES=$(ls Folio-Dome-*.ipa Folio-Dome-*-swiftpm.zip ipa.sha256 selftest.json selftest.png selftest.pdf 2>/dev/null || true)
          gh release delete ipad-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ipad-latest --prerelease --target "$GITHUB_SHA" \
            --title "iPad build $VERSION (${GITHUB_SHA::7}), self test $PASSED" \
            --notes "Built by .github/workflows/ipad.yml from ${GITHUB_SHA::7}. Self test in the iOS Simulator: $PASSED. Install the .ipa with Sideloadly (docs/IPAD.md); it is unsigned until Sideloadly signs it with your Apple Account." \
            $FILES

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-dome-ipad
          path: |
            Folio-Dome-*.ipa
            Folio-Dome-*-swiftpm.zip
            ipa.sha256
            selftest.json
            selftest.png
            selftest.pdf
            simulator.log
            build-sim.log
            build-device.log
            build-pkg.log
          if-no-files-found: warn
