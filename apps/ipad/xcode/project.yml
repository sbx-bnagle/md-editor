# Xcode project for the iPad app, generated with XcodeGen (`xcodegen generate` in this folder).
# It builds the same sources as "Folio Dome.swiftpm", with the Info.plist settings an app package
# cannot set (the app's Documents folder in the Files app, local-network AI servers). The build
# on GitHub (.github/workflows/ipad.yml) uses it.
name: FolioDome
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.5"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FolioDome:
    type: application
    platform: iOS
    sources:
      - path: "../Folio Dome.swiftpm/Sources"
      - path: "../Folio Dome.swiftpm/Assets.xcassets"
      - path: "../Folio Dome.swiftpm/Resources/web"
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Folio Dome"
        PRODUCT_BUNDLE_IDENTIFIER: com.bradnagle.foliodome
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        # The Simulator build is signed locally (the self test needs the Keychain).
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Folio Dome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # The default library (Documents/Folio Dome Library) shows in the Files app under On My iPad › Folio Dome.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Folio Dome connects to an AI server on your network when you set one up in Settings.
